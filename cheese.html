<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AR Object</title>
  <!-- Import the <model-viewer> component -->
  <script type="module" src="https://googleapis.com"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    model-viewer {
      width: 100%;
      height: 400px;
      background-color: #f4f4f4;
      border-radius: 12px;
    }
    /* Custom styling for the Launch AR button */
    #ar-button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <h1>Augmented Reality Object</h1>
  <p>Tap the button below on your phone to place this in your room.</p>

  <!-- The 3D and AR Viewer -->
  <model-viewer 
    src="cheese.glb" 
    ios-src="cheese.usdz" 
    alt="a cheese in AR" 
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
    
    <button slot="ar-button" id="ar-button">
      Launch AR
    </button>
  </model-viewer>

</body>
</html>
